name: Send push reminders

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (UTC); times are converted to Europe/Brussels in code
  workflow_dispatch: {}        # allows manual "Run workflow" from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: push-sender
        run: npm install --no-audit --no-fund
      - name: Send due reminders
        working-directory: push-sender
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send.js
