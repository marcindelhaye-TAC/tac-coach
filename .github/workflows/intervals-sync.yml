name: Sync workouts to Intervals.icu

on:
  schedule:
    - cron: '*/30 * * * *'        # every 30 minutes — near-constant two-way sync
    - cron: '*/10 4-8 * * *'      # extra morning runs (06:00–10:00 Brussels) → fresh HRV/RHR for the daily readiness score
  workflow_dispatch: {}          # manual "Run workflow" from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: push-sender
        run: npm install --no-audit --no-fund
      - name: Push planned workouts to Intervals.icu
        working-directory: push-sender
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node intervals-sync.js
